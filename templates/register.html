<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — Ledger</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0F1712;color:#1E2A22;font-family:system-ui,sans-serif}
    main{width:min(420px,calc(100% - 40px));background:#F4EFE0;padding:34px;border-radius:8px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
    h1{margin:0 0 8px}p{color:#4A5A4E}.field{display:grid;gap:6px;margin:14px 0}input{padding:11px;border:1px solid #D9D0B7;border-radius:4px;font:inherit}button{width:100%;padding:11px;border:0;border-radius:4px;background:#1E2A22;color:#F4EFE0;font-weight:700;cursor:pointer}.message{padding:10px;background:#F5DDD7;color:#742E22;border-radius:4px;margin:12px 0}a{color:#3E6B4E}
  </style>
</head>
<body>
  <main>
    <h1>Create account</h1>
    <p>Your six default categories will be created automatically.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="message">{{ message }}</div>{% endfor %}
    {% endwith %}
    <form method="POST" action="{{ url_for('register') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field"><label for="username">Username</label><input id="username" name="username" minlength="3" maxlength="50" autocomplete="username" required autofocus></div>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" maxlength="255" autocomplete="email" required></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required></div>
      <div class="field"><label for="password_confirmation">Confirm password</label><input id="password_confirmation" name="password_confirmation" type="password" minlength="8" autocomplete="new-password" required></div>
      <button type="submit">Create account</button>
    </form>
    <p>Already registered? <a href="{{ url_for('login') }}">Sign in</a>.</p>
  </main>
</body>
</html>
