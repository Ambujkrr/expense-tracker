<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password — Ledger</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0F1712;color:#1E2A22;font-family:system-ui,sans-serif}
    main{width:min(420px,calc(100% - 40px));background:#F4EFE0;padding:34px;border-radius:8px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
    h1{margin:0 0 8px}p{color:#4A5A4E}.field{display:grid;gap:6px;margin:14px 0}input{padding:11px;border:1px solid #D9D0B7;border-radius:4px;font:inherit}button{width:100%;padding:11px;border:0;border-radius:4px;background:#1E2A22;color:#F4EFE0;font-weight:700;cursor:pointer}.message{padding:10px;background:#F5DDD7;color:#742E22;border-radius:4px;margin:12px 0}.message.success{background:#D1E7DD;color:#0F5132}.message.info{background:#D1ECF1;color:#0C5460}a{color:#3E6B4E}.links{display:flex;justify-content:space-between;margin-top:16px;font-size:0.92rem}
  </style>
</head>
<body>
  <main>
    <h1>Set new password</h1>
    <p>Enter the 6-digit code sent to your email and your new password.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="message {{ category }}">{{ message }}</div>{% endfor %}
    {% endwith %}
    <form method="POST" action="{{ url_for('reset_password') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" value="{{ email or '' }}" maxlength="255" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="otp">6-digit verification code</label>
        <input id="otp" name="otp" type="text" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" placeholder="123456" autocomplete="one-time-code" required autofocus>
      </div>
      <div class="field">
        <label for="password">New password</label>
        <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label for="password_confirmation">Confirm new password</label>
        <input id="password_confirmation" name="password_confirmation" type="password" minlength="8" autocomplete="new-password" required>
      </div>
      <button type="submit">Reset password</button>
    </form>
    <div class="links">
      <a href="{{ url_for('forgot_password') }}">Resend code</a>
      <a href="{{ url_for('login') }}">Back to sign in</a>
    </div>
  </main>
</body>
</html>
