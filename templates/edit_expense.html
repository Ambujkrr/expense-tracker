<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Expense</title>

</head>


<body>

    <h1>Edit Expense</h1>


    <form
        method="POST"
        action="/update-expense/{{ expense.id }}"
    >


        <!-- AMOUNT -->

        <label>Amount:</label>

        <input
            type="number"
            name="amount"
            step="0.01"
            min="0"
            value="{{ expense.amount }}"
            required
        >

        <br><br>


        <!-- CATEGORY -->

        <label>Category:</label>

        <select name="category_id" required>

            <option
                value="1"
                {% if expense.category_id == 1 %}selected{% endif %}
            >
                Food
            </option>


            <option
                value="2"
                {% if expense.category_id == 2 %}selected{% endif %}
            >
                Transport
            </option>


            <option
                value="3"
                {% if expense.category_id == 3 %}selected{% endif %}
            >
                Entertainment
            </option>


            <option
                value="4"
                {% if expense.category_id == 4 %}selected{% endif %}
            >
                Shopping
            </option>


            <option
                value="5"
                {% if expense.category_id == 5 %}selected{% endif %}
            >
                Education
            </option>


            <option
                value="6"
                {% if expense.category_id == 6 %}selected{% endif %}
            >
                Other
            </option>

        </select>

        <br><br>


        <!-- DATE -->

        <label>Date:</label>

        <input
            type="date"
            name="expense_date"
            value="{{ expense.expense_date }}"
            required
        >

        <br><br>


        <!-- NOTE -->

        <label>Note:</label>

        <input
            type="text"
            name="note"
            value="{{ expense.note }}"
        >

        <br><br>


        <button type="submit">
            Update Expense
        </button>


        <a href="/">
            <button type="button">
                Cancel
            </button>
        </a>


    </form>


</body>

</html>
