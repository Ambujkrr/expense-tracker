<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Expense</title>

</head>


<body>

    <h1>Edit Expense</h1>


    <form
        method="POST"
        action="/update-expense/{{ expense.id }}"
    >
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">


        <!-- AMOUNT -->

        <label>Amount:</label>

        <input
            type="number"
            name="amount"
            step="0.01"
            min="0"
            value="{{ expense.amount }}"
            required
        >

        <br><br>


        <!-- CATEGORY -->

        <label>Category:</label>

        <select name="category_id" required>

            {% for category in categories %}
            <option value="{{ category.id }}" {% if expense.category_id == category.id %}selected{% endif %}>
                {{ category.name }}
            </option>
            {% endfor %}

        </select>

        <br><br>


        <!-- DATE -->

        <label>Date:</label>

        <input
            type="date"
            name="expense_date"
            value="{{ expense.expense_date }}"
            required
        >

        <br><br>


        <!-- NOTE -->

        <label>Note:</label>

        <input
            type="text"
            name="note"
            value="{{ expense.note }}"
        >

        <br><br>


        <button type="submit">
            Update Expense
        </button>


        <a href="/">
            <button type="button">
                Cancel
            </button>
        </a>


    </form>


</body>

</html>
